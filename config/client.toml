# Alya VPN - Client Configuration
[client]
server_host = "127.0.0.1"
server_port = 51821
local_proxy_port = 1080
passphrase = "change_me_to_a_secure_shared_passphrase_2026"
protocol = "tcp"
crypto_threads = 1
io_threads = 2

[connection]
# Automatically reconnect if VPN server connection drops
auto_reconnect = true
# Maximum reconnect attempts before giving up (0 = retry indefinitely)
reconnect_attempts = 10
# Delay between reconnect attempts in milliseconds
reconnect_interval_ms = 3000
# SOCKS5 handshake timeout in milliseconds
handshake_timeout_ms = 3000
# Direct connection timeout in milliseconds
connect_timeout_ms = 3000

[performance]
# Enable TCP_NODELAY (disables Nagle algorithm for lower latency in gaming and voice chat)
tcp_nodelay = true

[logging]
# Show connections tunneled through the VPN in the console
log_tunnel_traffic = true
# Show direct local bypass connections in the console (set to false to reduce console clutter)
log_direct_traffic = false

[dns]
# DNS Protection & Routing:
#   true  - Route DNS queries through encrypted VPN tunnel to prevent ISP tampering/censorship (default).
#   false - Use local network DNS for direct connections.
tunnel_dns = true

# Custom DNS servers to tunnel (IPs or hostnames/domains).
# If empty, built-in defaults are used:
# Cloudflare (1.1.1.1, 1.0.0.1, one.one.one.one, cloudflare-dns.com),
# Google (8.8.8.8, 8.8.4.4, dns.google),
# Quad9 (9.9.9.9, 149.112.112.112, dns.quad9.net),
# AdGuard (94.140.14.14, 94.140.15.15, dns.adguard-dns.com),
# OpenDNS (208.67.222.222, 208.67.220.220),
# Mullvad (194.242.2.2, 194.242.2.3, dns.mullvad.net),
# Control D (76.76.2.0, 76.76.10.0)
dns_servers = [
    # "1.1.1.1",
    # "8.8.8.8"
]

# System DNS resolver process names to tunnel.
# If empty, built-in defaults are used:
# mDNSResponder (macOS), systemd-resolved (Linux), dnsmasq, named, resolved, dnscrypt-proxy, stubby, unbound
dns_resolvers = [
    # "mDNSResponder",
    # "systemd-resolved"
]

[split_tunnel]
# Modes:
#   "all"     - Route all network traffic through the encrypted VPN tunnel.
#   "include" - (Whitelist) Only specified applications/domains route through VPN; all others use direct local internet.
#   "exclude" - (Blacklist) Specified applications/domains bypass VPN (direct internet); all other apps route through VPN.
mode = "include"

# Bypass local LAN traffic (192.168.x.x, 10.x.x.x, 172.16-31.x.x, .local) even in "all" mode
bypass_lan = true

# Target applications to route/bypass (process name or pattern, case-insensitive, .exe optional)
apps = [
    "Speedtest",
    "Discord",
    "Discord Helper",
    "ShipIt",
    "Chrome",
    "curl"
]

# Target domains or wildcards to route/bypass (e.g. "*.discord.com", "api.github.com")
domains = [
    # "*.discord.com",
    # "*.discordapp.com",
    # "*.discord.gg"
]
