# Alya VPN - Client Configuration
#
# HOW THIS FILE IS READ (src/main.alya: load_client_config):
# - Section headers ([client], [dns], ...) are cosmetic; keys live in one
#   flat namespace. Do not define the same key twice.
# - Precedence (highest wins): CLI flags > --config <file> > this file >
#   built-in defaults. Every key below is optional.
# - Booleans accept lowercase "true"/"1" (on) and "false"/"0" (off) only.
#   "True", "yes" or "on" are NOT recognized and leave the previous value.
# - Arrays accept inline (apps = ["a", "b"]) or multi-line bracket form.
# - Time units matter: keys ending in _ms are milliseconds, _sec are seconds.

[client]
# Local interface for the SOCKS5 proxy.
# "127.0.0.1" = this machine only. "0.0.0.0" = share on your LAN (then
# anyone on your network can use your tunnel; protect with firewall rules).
# Dual-stack: an IPv6 companion always listens too ("::1" for loopback,
# "::" for 0.0.0.0, or the address itself when an IPv6 literal is given,
# in which case IPv4 is skipped). Apps dialing [::1]:port just work.
# Aliases: bind_ip.
bind_address = "127.0.0.1"

# Local SOCKS5 (TCP) listen port. Point apps / OS proxy settings here.
# It also answers HTTP CONNECT, so apps that only accept an HTTP proxy URL
# can use http://127.0.0.1:1080 (use the matching port if changed below).
# Alias: local_port.
local_proxy_port = 1080

# UDP relay listen port for SOCKS5 UDP ASSOCIATE.
# 0 = automatic (local_proxy_port + 1, ephemeral fallback on conflict).
# Set explicitly when the auto port collides or firewall rules need a pin.
# Aliases: udp_port.
udp_relay_port = 0
# NOTE: when protocol includes UDP (default), a UDP relay for SOCKS5
# UDP ASSOCIATE is opened automatically on local_proxy_port + 1
# (here: 127.0.0.1:1081, ephemeral fallback if occupied).

# Remote VPN server endpoint (the [server] section of server.toml).
server_host = "127.0.0.1"
# server_host = "127.0.0.1"  # local test server alternative
server_port = 51822

# Shared secret for ChaCha20-Poly1305. MUST be identical on server and
# client. NEVER leave the default value on a public server: anyone who
# knows it can use your tunnel and decrypt its traffic.
passphrase = "change_me_to_a_secure_shared_passphrase_2026"

# Forwarded payload types. Case-insensitive. Aliases: forward_protocol.
#   "tcp"  - TCP only. No UDP relay is opened; UDP ASSOCIATE is refused.
#   "udp"  - UDP only (UDP-over-TCP tunnel). TCP CONNECT is refused locally
#            with a [PROTO] log line.
#   "both" - TCP and UDP (default). Recommended: keep "both" on both ends.
#            Unknown values also fall back to "both".
# The client<->server tunnel itself always runs over TCP; "udp" only means
# UDP datagrams are carried inside it. Client and server modes must overlap
# (e.g. client "udp-only" + server "tcp-only" forwards nothing).
protocol = "both"

# Worker threads for crypto and I/O. 1/2 suits laptops and matches the
# built-in defaults; raise on busy machines.
crypto_threads = 1
io_threads = 2

# Automatically set the OS proxy (Windows registry / macOS networksetup +
# launchctl env) to this proxy on startup and restore it on clean exit.
# macOS: applies to ALL enabled network services (Wi-Fi, Ethernet, iPhone
# USB, Thunderbolt, ...) and, while tunnel_dns is on, points OS DNS at
# uncensored resolvers (saved values are restored on exit).
# Aliases: system_proxy, auto_system_proxy.
# WARNING: if the client is force-killed, OS proxy/DNS may stay overridden
# (Windows: Internet Options > LAN settings; macOS: networksetup
# -setdnsservers <svc> Empty). Restart tunneled apps AFTER starting the
# client so they pick up the proxy/DNS settings.
auto_sys_proxy = true

[connection]
# Reconnect automatically when the tunnel drops.
auto_reconnect = true
# Max reconnect attempts. 0 = retry indefinitely. Alias: max_reconnect_attempts.
reconnect_attempts = 0
# Wait between attempts. Milliseconds. Alias: reconnect_interval.
reconnect_interval_ms = 2000
# Deadline for one SOCKS5 / HTTP CONNECT / SOCKS4 handshake, including slow
# or fragmented arrivals (reads are deadline-based, not single-recv).
# Milliseconds. Alias: handshake_timeout.
handshake_timeout_ms = 3000
# Timeout for DIRECT (bypass) outbound connects. Milliseconds.
# Alias: connect_timeout. Tunneled connects have no client-side timeout here.
connect_timeout_ms = 3000
# Idle teardown for TCP channels, in seconds. 0 = never expire.
# UDP association mappings use this too, but fall back to 120s when 0.
# Alias: idle_timeout.
idle_timeout_sec = 300
# Keep-alive ping to keep NAT sessions open, in seconds. 0 = disabled.
# Alias: ping_interval.
ping_interval_sec = 15

[security]
# Kill switch: on tunnel loss with auto_reconnect = false, exit immediately
# instead of leaving bypass/direct paths usable during the outage.
# With auto_reconnect = true both settings attempt reconnect first.
kill_switch = false

[performance]
# TCP_NODELAY (disables Nagle) for lower latency in gaming / voice / chat.
# Alias: nodelay.
tcp_nodelay = true

[monitoring]
# Periodic traffic summary ([STATS] TX/RX bytes, packets, channel count).
# Alias: stats.
show_stats = true
# Interval for the summary, in seconds. Ignored unless show_stats = true.
# Alias: stats_interval.
stats_interval_sec = 10

[logging]
# One line per tunneled connection: [TUNNEL] [AppName] -> host:port.
log_tunnel_traffic = true
# One line per DIRECT (bypassed) connection: [DIRECT] [AppName] -> host:port.
# Keep true while tuning rules: if Discord shows up here, it is NOT using
# the VPN (typical cause: raw-IP request + unrecognized process, see below).
log_direct_traffic = true

[dns]
# DNS routing intent (honest scope: there is no TUN interface, so raw
# UDP/53 from the OS resolver can NEVER enter the SOCKS proxy):
#   true  - SOCKS-routed DNS (port 53/853, known DNS servers below) plus
#           known resolver processes are forced through the tunnel, and
#           tunneled apps are encouraged to resolve server-side.
#   false - leave DNS to the local network.
# Alias: route_dns. This does NOT stop ISP DNS poisoning by itself:
# set the OS DNS manually (1.1.1.1 / 8.8.8.8) and restart tunneled apps.
tunnel_dns = true

# Extra DNS server IPs/hostnames treated as tunnel-always (in addition to
# the built-in Cloudflare / Google / Quad9 / AdGuard / OpenDNS / Mullvad /
# Control D list). Empty = built-ins only. Matched by SOCKS target host.
dns_servers = [
    # "1.1.1.1",
    # "8.8.8.8"
]

# Extra resolver process names treated as tunnel-always (in addition to the
# built-ins: mDNSResponder, systemd-resolved, dnsmasq, named, resolved,
# dnscrypt-proxy, stubby, unbound). Empty = built-ins only.
dns_resolvers = [
    # "mDNSResponder",
    # "systemd-resolved"
]

[split_tunnel]
# Routing mode. Case-insensitive; "inc"~"include", "exc"~"exclude" accepted.
# Unknown values keep the built-in default ("exclude"), so spell carefully.
#   "all"     - everything via VPN (safest for censorship; highest VPS use).
#   "include" - whitelist: ONLY listed apps/domains via VPN, rest direct.
#   "exclude" - blacklist: listed apps/domains direct, everything else via VPN.
mode = "include"

# Bypass private targets without consulting VPN, even in "all" mode:
# 10/8, 172.16/12, 192.168/16, 169.254/16 link-local, *.local, *.lan,
# *.home, *.internal. Alias: local_network_bypass.
bypass_lan = true

# Extra bypass entries on top of the standard LAN list. Three forms:
#   "192.168.7.0/24"  - CIDR subnet (masked compare; also public subnets,
#                       e.g. office egress "203.0.113.0/24" stays direct).
#   "corp.internal"   - domain suffix (also matches "x.corp.internal").
#   "192.168.1."      - plain prefix (kept for back-compat).
bypass_lan_ranges = [
    # "192.168.1.0/24",
    # "corp.internal",
    # "nas.home"
]

# App matching (process name, case-insensitive): exact, ".exe"-tolerant
# ("Discord" matches "Discord.exe"), prefix-with-delimiter ("Discord"
# matches "Discord Helper", "Discord-Worker"), wildcards ("steam*",
# "*torrent*", "*cord.exe"), and bundle substring ("discord" matches
# "com.hnc.Discord"). One entry covers helper/child processes, so listing
# every "Discord Helper (...)" variant is unnecessary. "ShipIt" is the
# Discord updater; "curl" is for command-line tests:
# curl -x socks5h://127.0.0.1:1080 https://discord.com/api/v9/gateway
# (socks5h = resolve the hostname through the proxy).
apps = [
    "Discord",
    "ShipIt",
    "curl"
]

# Domain matching (case-insensitive). "*.example.com" matches subdomains
# ONLY (cdn.example.com), never the bare domain, so list both forms.
# If the app sends a raw IP (post-DNS SOCKS request, e.g. 162.159.x.x:443),
# no domain rule can match and the process rule decides; with mode =
# "include" an unrecognized process ("unknown") goes DIRECT and hits the
# ISP block. Symptoms and cures: watch log_direct_traffic, test once with
# mode = "all", prefer socks5h-style hostname requests, fix OS DNS (see
# [dns] above). UDP voice/media flows via the UDP relay when the app uses
# SOCKS5 UDP ASSOCIATE; raw UDP that never enters the proxy is not captured.
domains = [
    "discord.com",
    "*.discord.com",
	"updates.discord.com",
    "discordapp.com",
    "*.discordapp.com",
	"cdn.discordapp.com",
    "discordapp.net",
    "*.discordapp.net",
	"cdn.discordapp.net",
    "discord.gg",
    "*.discord.gg",
    "gateway.discord.gg",
    "discord.media",
    "*.discord.media",
    "discordcdn.com",
    "*.discordcdn.com",
    "discordstatus.com",
    "*.discordstatus.com"
]
