[package]
name = "vpn"
version = "0.2.13"
alya-version = "0.0.19"
entry = "src/main.alya"
description = "High-performance split-tunneling VPN server and client for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/vpn"
keywords = ["alya", "vpn", "tunnel", "network", "split-tunneling", "proxy", "security"]

[workspace]
members = ["crates/*"]

[dependencies]
vpn_common = { path = "crates/vpn_common" }
vpn_client = { path = "crates/vpn_client" }
vpn_server = { path = "crates/vpn_server" }

[profile.release]
opt-level = 3
debug = false
