name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alya installation
        run: |
          alya --version

      # The first gcc in PATH on the runner links gcc's default -lpthread
      # against libwinpthread-1.dll, so built exes only started where that
      # build-image DLL exists (alya-lang/vpn#9). Pin the minimal C toolchain
      # setup-alya pre-installs before anything compiles: the build cache keys
      # on the alya compiler, not the C toolchain, so artifacts cached here by
      # the runner's gcc would be served to every later build in this job.
      - name: Pin bundled C toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ToolchainBin = Join-Path $env:USERPROFILE ".alya\toolchain\bin"
          $Compiler = @("gcc.exe", "clang.exe") |
            ForEach-Object { Join-Path $ToolchainBin $_ } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $Compiler) {
            throw "Alya C toolchain not found at $ToolchainBin (setup-alya should pre-install it)"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $ToolchainBin
          Write-Host "Pinned C toolchain: $ToolchainBin"
          & $Compiler --version | Select-Object -First 1

      - name: Install workspace dependencies
        run: |
          alya install

      - name: Verify workspace members
        run: |
          alya pkg list
          alya check --workspace

      - name: Run crypto test suite
        run: |
          alya run tests/test_crypto.alya

      - name: Run protocol test suite
        run: |
          alya run tests/test_protocol.alya

      - name: Run routing rules test suite
        run: |
          alya run tests/test_rules.alya

      - name: Run end-to-end flow test suite
        run: |
          alya run tests/test_e2e.alya

      - name: Run forward protocol mode test suite
        run: |
          alya run tests/test_protocol_mode.alya

      - name: Run native routing test suite
        run: |
          alya run tests/test_native_routing.alya

      - name: Run UDP relay test suite
        run: |
          alya run tests/test_udp_relay.alya

      - name: Run config validation test suite
        run: |
          alya run tests/test_config.alya

      - name: Run client log label test suite
        run: |
          alya run tests/test_client_log.alya

      - name: Run dial reconnect test suite
        run: |
          alya run tests/test_reconnect.alya

      - name: Run health endpoint test suite
        run: |
          alya run tests/test_health.alya

      - name: Run log level test suite
        run: |
          alya run tests/test_logging.alya

      - name: Run hardening test suite
        run: |
          alya run tests/test_hardening.alya

      - name: Run DNS cache test suite
        run: |
          alya run tests/test_dns_cache.alya

      - name: Run benchmark
        run: |
          alya run src/main.alya -- benchmark

      - name: Build standalone binary
        run: |
          alya build src/main.alya -o alya-vpn${{ runner.os == 'Windows' && '.exe' || '' }}

      # A clean end-user machine has none of the build image's MinGW DLLs:
      # run the exe with a stripped PATH so a missing runtime DLL (loader
      # error, e.g. 0xc0000135) fails the job instead of shipping.
      - name: Verify binary loads on a clean machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & ".\alya-vpn.exe"
          if ($LASTEXITCODE -ne 0) {
            throw "alya-vpn.exe failed to start with a clean-machine PATH (exit $LASTEXITCODE); it likely imports a build-image DLL such as libwinpthread-1.dll"
          }

      # Live end-to-end test: starts a real server+client pair on the runner
      # and proves tunneling (SOCKS5 + HTTP CONNECT) and split tunneling
      # (include/exclude) against a non-loopback target on the runner itself.
      - name: Live tunnel smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/live_smoke.sh ./alya-vpn

      - name: Live tunnel smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/live_smoke.ps1 ./alya-vpn.exe
