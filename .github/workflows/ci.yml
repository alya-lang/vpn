name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-15-intel]
        include:
          - os: ubuntu-latest
            label: Linux x64
          - os: ubuntu-24.04-arm
            label: Linux ARM64
          - os: windows-latest
            label: Windows x64
          - os: windows-11-arm
            label: Windows ARM64
          - os: macos-latest
            label: macOS ARM64
          - os: macos-15-intel
            label: macOS Intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alya installation
        run: |
          alya --version

      - name: Run crypto test suite
        run: |
          alya run tests/test_crypto.alya

      - name: Run protocol test suite
        run: |
          alya run tests/test_protocol.alya

      - name: Run routing rules test suite
        run: |
          alya run tests/test_rules.alya

      - name: Run end-to-end flow test suite
        run: |
          alya run tests/test_e2e.alya

      - name: Run forward protocol mode test suite
        run: |
          alya run tests/test_protocol_mode.alya

      - name: Run native routing test suite
        run: |
          alya run tests/test_native_routing.alya

      - name: Run UDP relay test suite
        run: |
          alya run tests/test_udp_relay.alya

      - name: Run config validation test suite
        run: |
          alya run tests/test_config.alya

      - name: Run client log label test suite
        run: |
          alya run tests/test_client_log.alya

      - name: Run dial reconnect test suite
        run: |
          alya run tests/test_reconnect.alya

      - name: Run benchmark
        run: |
          alya run src/main.alya -- benchmark

      # TEMP-DIAG: full discovery run (incl. scratch). Non-blocking on
      # purpose: we only want the log while diagnosing the macOS bus error.
      # TODO(remove after diagnosis): delete this step.
      - name: TEMP DIAG full alya test discovery
        continue-on-error: true
        run: |
          alya test

      # TEMP-DIAG: start the real client on the commented config and capture
      # whether it prints the banner (clean) or dies by signal (bus error).
      # --no-system-proxy keeps the runner proxy untouched. The bundled
      # server_host is an unresolvable placeholder, so a clean client exits
      # fast on connect; the banner + exit code are the signals we check.
      # no banner + exit 138/134 = bus error reproduced in run-mode.
      # TODO(remove after diagnosis): delete this step.
      - name: TEMP DIAG client startup on commented config
        shell: bash
        run: |
          alya run src/main.alya -- client --config config/client.toml --no-system-proxy > /tmp/vpnclient-probe.log 2>&1 &
          CLIENT_PID=$!
          sleep 90
          echo "--- probe log head ---"
          head -30 /tmp/vpnclient-probe.log || true
          kill $CLIENT_PID 2>/dev/null || true
          sleep 2
          kill -9 $CLIENT_PID 2>/dev/null || true
          CODE=0
          wait $CLIENT_PID 2>/dev/null || CODE=$?
          echo "client exit code: $CODE"
          echo "--- banner check ---"
          grep -c "Alya VPN Client Active" /tmp/vpnclient-probe.log || true

      - name: Build standalone binary
        run: |
          alya build src/main.alya -o alya-vpn-ci

      # TEMP-DIAG: exercise the BUILT binary. The bus error only ever shows
      # in build output, never under `alya run`, so this is the decisive
      # probe: same config, same machine, different artifact.
      # TODO(remove after diagnosis): delete this step.
      - name: TEMP DIAG probe built binary
        shell: bash
        run: |
          BIN=./alya-vpn-ci
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" check-port 1080 || true
          "$BIN" benchmark || true
          "$BIN" client --config config/client.toml --no-system-proxy > /tmp/vpnbuilt-probe.log 2>&1 &
          CLIENT_PID=$!
          sleep 60
          echo "--- built probe log head ---"
          head -30 /tmp/vpnbuilt-probe.log || true
          kill $CLIENT_PID 2>/dev/null || true
          sleep 2
          kill -9 $CLIENT_PID 2>/dev/null || true
          CODE=0
          wait $CLIENT_PID 2>/dev/null || CODE=$?
          echo "built client exit code: $CODE"
          echo "--- banner check ---"
          grep -c "Alya VPN Client Active" /tmp/vpnbuilt-probe.log || true

      # TEMP-DIAG: keep the built binaries so a real Mac can test whether a
      # CI-built artifact also bus-errors (separates "local build env" from
      # "codegen"). TODO(remove after diagnosis): delete this step.
      - name: TEMP DIAG upload built binary
        uses: actions/upload-artifact@v4
        with:
          name: alya-vpn-${{ matrix.os }}
          path: alya-vpn-ci*
