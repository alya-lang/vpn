name: Code scanning

# Runs the Alya linter with SARIF output and uploads the results to GitHub
# code scanning (Security tab findings + pull request annotations).
# Findings do not fail this workflow; they are tracked as code scanning
# alerts instead (the `alya lint . --check` CI gate lives in ci.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # Weekly on Monday at 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  alya-lint:
    name: Alya lint SARIF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya
        uses: alya-lang/setup-alya@v1

      - name: Run Alya linter (SARIF)
        run: alya lint . --format sarif -o alya-lint.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: alya-lint.sarif
          category: alya-lint
