name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.os-name }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            os-name: linux-x64
            binary: alya-vpn
            archive: alya-vpn-linux-x64.tar.gz
          - runner: windows-latest
            os-name: windows-x64
            binary: alya-vpn.exe
            archive: alya-vpn-windows-x64.zip
          - runner: macos-latest
            os-name: macos-arm64
            binary: alya-vpn
            archive: alya-vpn-macos-arm64.tar.gz
          - runner: macos-latest
            os-name: macos-x64
            binary: alya-vpn
            archive: alya-vpn-macos-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya Compiler (Standard)
        if: matrix.target.os-name != 'macos-x64'
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Set up Alya Compiler (macOS x86_64 via Rosetta)
        if: matrix.target.os-name == 'macos-x64'
        run: |
          curl -sSL -o alyac-x64.tar.gz https://github.com/alya-lang/alya/releases/download/v0.0.14/alyac-v0.0.14-x86_64-macos.tar.gz
          tar -xzf alyac-x64.tar.gz
          sudo cp alyac-v0.0.14-x86_64-macos/alyac /usr/local/bin/alyac
          sudo chmod +x /usr/local/bin/alyac
          rm -rf alyac-x64.tar.gz alyac-v0.0.14-x86_64-macos

      - name: Verify alyac installation (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target.os-name }}" = "macos-x64" ]; then
            arch -x86_64 alyac --version
          else
            alyac --version
          fi

      - name: Verify alyac installation (Windows)
        if: runner.os == 'Windows'
        run: |
          alyac --version

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target.os-name }}" = "macos-x64" ]; then
            arch -x86_64 alyac build -o ${{ matrix.target.binary }}
            file ${{ matrix.target.binary }}
          else
            alyac build -o ${{ matrix.target.binary }}
            file ${{ matrix.target.binary }}
          fi

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          alyac build -o ${{ matrix.target.binary }}

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/config
          Copy-Item ${{ matrix.target.binary }} dist/
          Copy-Item config/*.toml dist/config/
          if (Test-Path README.md) { Copy-Item README.md dist/ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist/ }
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.target.archive }}

      - name: Package artifacts (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/config
          cp ${{ matrix.target.binary }} dist/
          chmod +x dist/${{ matrix.target.binary }}
          cp config/*.toml dist/config/
          cp README.md dist/ 2>/dev/null || true
          cp LICENSE dist/ 2>/dev/null || true
          tar -czvf ${{ matrix.target.archive }} -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.os-name }}
          path: ${{ matrix.target.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          ls -la artifacts/

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          python3 .github/scripts/generate_release_notes.py "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.title }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          draft: false
          prerelease: false
