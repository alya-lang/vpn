name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.13)'
        required: true
        default: 'v0.2.13'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            platform: x86_64-linux
            binary: alya-vpn
            archive: tar.gz
          - runner: ubuntu-24.04-arm
            platform: arm64-linux
            binary: alya-vpn
            archive: tar.gz
          - runner: macos-latest
            platform: arm64-macos
            binary: alya-vpn
            archive: tar.gz
          - runner: macos-15-intel
            platform: x86_64-macos
            binary: alya-vpn
            archive: tar.gz
          - runner: windows-latest
            platform: x86_64-windows
            binary: alya-vpn.exe
            archive: zip
          - runner: windows-11-arm
            platform: arm64-windows
            binary: alya-vpn.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Alya Compiler
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Verify alya installation
        run: |
          alya --version

      - name: Build binary
        run: |
          alya build -o ${{ matrix.target.binary }}

      - name: Package artifacts (Unix)
        if: matrix.target.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          PACKAGE_NAME="alya-vpn-${VERSION}-${{ matrix.target.platform }}"
          mkdir -p "${PACKAGE_NAME}/config"
          cp "${{ matrix.target.binary }}" "${PACKAGE_NAME}/"
          chmod +x "${PACKAGE_NAME}/${{ matrix.target.binary }}"
          cp config/*.toml "${PACKAGE_NAME}/config/"
          cp README.md LICENSE "${PACKAGE_NAME}/" 2>/dev/null || true
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          shasum -a 256 "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Package artifacts (Windows)
        if: matrix.target.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $PackageName = "alya-vpn-$Version-${{ matrix.target.platform }}"
          New-Item -ItemType Directory -Force -Path "$PackageName/config" | Out-Null
          Copy-Item "${{ matrix.target.binary }}" -Destination $PackageName
          Copy-Item "config/*.toml" -Destination "$PackageName/config"
          if (Test-Path README.md) { Copy-Item README.md -Destination $PackageName }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $PackageName }
          Compress-Archive -Path $PackageName -DestinationPath "$PackageName.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$PackageName.zip").Hash.ToLower()
          "$hash  $PackageName.zip" | Out-File -FilePath "$PackageName.zip.sha256" -Encoding ascii

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target.platform }}
          path: |
            alya-vpn-*-${{ matrix.target.platform }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: List downloaded artifacts
        run: |
          ls -la dist/

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          python3 .github/scripts/generate_release_notes.py "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ inputs.prerelease == true || (inputs.prerelease != false && contains(steps.notes.outputs.tag, '-')) }}
