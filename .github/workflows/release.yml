name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.9)'
        required: true
        default: 'v0.2.9'
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target.platform }})
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: ubuntu-latest
            platform: x86_64-linux
            binary: alya-vpn
            archive: tar.gz
          - runner: macos-latest
            platform: arm64-macos
            binary: alya-vpn
            archive: tar.gz
          - runner: macos-latest
            platform: x86_64-macos
            binary: alya-vpn
            archive: tar.gz
          - runner: windows-latest
            platform: x86_64-windows
            binary: alya-vpn.exe
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Alya Compiler (Standard)
        if: matrix.target.platform != 'x86_64-macos'
        uses: alya-lang/setup-alya@v1
        with:
          version: 'latest'

      - name: Set up Alya Compiler (macOS x86_64 via Rosetta)
        if: matrix.target.platform == 'x86_64-macos'
        run: |
          curl -fsSL -o alya-x64.tar.gz https://github.com/alya-lang/alya/releases/download/v0.0.18/alya-v0.0.18-x86_64-macos.tar.gz || \
          curl -fsSL -o alya-x64.tar.gz https://github.com/alya-lang/alya/releases/download/v0.0.17/alya-v0.0.17-x86_64-macos.tar.gz || \
          curl -fsSL -o alya-x64.tar.gz https://github.com/alya-lang/alya/releases/download/v0.0.16/alya-v0.0.16-x86_64-macos.tar.gz
          tar -xzf alya-x64.tar.gz
          sudo cp alya-*/alya /usr/local/bin/alya
          sudo chmod +x /usr/local/bin/alya
          rm -rf alya-x64.tar.gz alya-*

      - name: Verify alya installation (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target.platform }}" = "x86_64-macos" ]; then
            arch -x86_64 alya --version
          else
            alya --version
          fi

      - name: Verify alya installation (Windows)
        if: runner.os == 'Windows'
        run: |
          alya --version

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.target.platform }}" = "x86_64-macos" ]; then
            arch -x86_64 alya src/main.alya -S -o main.s
            sed -i.bak -e 's/add \$\([0-9]*\), alya_allocated_bytes/addq $\1, alya_allocated_bytes/g' main.s && rm -f main.s.bak
            clang -arch x86_64 -O2 -std=c11 -Ic -c c/crypto.c -o crypto.o
            clang -arch x86_64 -O2 -std=c11 -Ic -c c/proc_resolver.c -o proc_resolver.o
            clang -arch x86_64 -O2 -std=c11 -Ic -c c/buffer_pool.c -o buffer_pool.o
            clang -arch x86_64 -O2 -std=c11 -Ic -c c/thread_pool.c -o thread_pool.o
            clang -arch x86_64 main.s crypto.o proc_resolver.o buffer_pool.o thread_pool.o -o ${{ matrix.target.binary }}
            rm -f main.s *.o
            file ${{ matrix.target.binary }}
          else
            alya build -o ${{ matrix.target.binary }}
            file ${{ matrix.target.binary }}
          fi

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          alya build -o ${{ matrix.target.binary }}

      - name: Package artifacts (Unix)
        if: matrix.target.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          PACKAGE_NAME="alya-vpn-${VERSION}-${{ matrix.target.platform }}"
          mkdir -p "${PACKAGE_NAME}/config"
          cp "${{ matrix.target.binary }}" "${PACKAGE_NAME}/"
          chmod +x "${PACKAGE_NAME}/${{ matrix.target.binary }}"
          cp config/*.toml "${PACKAGE_NAME}/config/"
          cp README.md LICENSE "${PACKAGE_NAME}/" 2>/dev/null || true
          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          shasum -a 256 "${PACKAGE_NAME}.tar.gz" > "${PACKAGE_NAME}.tar.gz.sha256"

      - name: Package artifacts (Windows)
        if: matrix.target.archive == 'zip'
        shell: pwsh
        run: |
          $Version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $PackageName = "alya-vpn-$Version-${{ matrix.target.platform }}"
          New-Item -ItemType Directory -Force -Path "$PackageName/config" | Out-Null
          Copy-Item "${{ matrix.target.binary }}" -Destination $PackageName
          Copy-Item "config/*.toml" -Destination "$PackageName/config"
          if (Test-Path README.md) { Copy-Item README.md -Destination $PackageName }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $PackageName }
          Compress-Archive -Path $PackageName -DestinationPath "$PackageName.zip"
          $hash = (Get-FileHash -Algorithm SHA256 "$PackageName.zip").Hash.ToLower()
          "$hash  $PackageName.zip" | Out-File -FilePath "$PackageName.zip.sha256" -Encoding ascii

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target.platform }}
          path: |
            alya-vpn-*-${{ matrix.target.platform }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: List downloaded artifacts
        run: |
          ls -la dist/

      - name: Generate Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          python3 .github/scripts/generate_release_notes.py "$TAG"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.notes.outputs.title }}
          tag_name: ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ inputs.prerelease == true || (inputs.prerelease != false && contains(steps.notes.outputs.tag, '-')) }}
