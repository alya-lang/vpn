services:
  vpn-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alya-vpn-server
    restart: unless-stopped
    ports:
      - "51820:51820"
    volumes:
      - ./config/server.toml:/app/config/server.toml:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 51820 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
