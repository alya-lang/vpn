services:
  vpn-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alya-vpn-server
    restart: unless-stopped
    ports:
      - "51822:51822"
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 51822 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
