services:
  vpn-server:
    # Prebuilt multi-arch image (linux/amd64 + linux/arm64), published by
    # .github/workflows/docker.yml. `docker compose up -d` pulls it; run
    # `docker compose up -d --build` to compile from this checkout instead.
    image: ghcr.io/alya-lang/vpn-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alya-vpn-server
    restart: unless-stopped
    ports:
      # Host port is overridable: on hosts where 51822 falls inside a
      # Hyper-V/WSL excluded range (Windows Docker Desktop), start with
      # VPN_PORT=52082 docker compose up -d
      - "${VPN_PORT:-51822}:51822"
    environment:
      - TZ=UTC
    # NOTE: this check needs health_port = 18080 in the mounted
    # server.toml (shipped default). With a custom config lacking it,
    # the container reports unhealthy: either set the port or revert
    # this test to: nc -z 127.0.0.1 51822 || exit 1
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' | nc -w 2 127.0.0.1 18080 | grep -q 'status.*ok' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
